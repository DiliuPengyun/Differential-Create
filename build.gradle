// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create: compile against it, ship nothing (it's a required mod dependency at runtime)
    compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}"
    // Exclude Create's transitive optional compat mods; enable selected ones explicitly below.
    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: "mezz.jei"
        exclude group: "maven.modrinth"
        exclude group: "dev.ftb.mods"
        exclude group: "info.journeymap"
        exclude group: "top.theillusivec4.curios"
        exclude group: "cc.tweaked"
        exclude group: "dev.architectury"
    }

    // JEI for viewing recipes during development.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Spark for measuring actual TPS and profiling development runs.
    localRuntime "maven.modrinth:spark:${spark_version}"

    // Create's compile-time dependencies (types referenced from Create's classes)
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

sourceSets {
    physicsTest {
        compileClasspath += sourceSets.main.output + sourceSets.gameTest.output
        runtimeClasspath += sourceSets.main.output + sourceSets.gameTest.output
    }
}
tasks.register('physicsTest', JavaExec) {
    dependsOn tasks.named('physicsTestClasses')
    classpath = sourceSets.physicsTest.runtimeClasspath
    mainClass = 'com.diliupengyun.differential_create.PhysicsRegression'
}
tasks.register('verifyReleaseJar') {
    def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (entry.name.startsWith('com/diliupengyun/differential_create/tests/')
                    || entry.name.matches('data/[^/]+/structure/(kineticphysicstests\\.)?physics_test\\.nbt'))
                    throw new GradleException("Development test included in release: ${entry.name}")
                if (entry.name.endsWith('.class')) {
                    def contents = archive.getInputStream(entry).withCloseable {
                        new String(it.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                    }
                    if (contents.contains('com/diliupengyun/differential_create/tests/'))
                        throw new GradleException("Release class depends on development tests: ${entry.name}")
                }
            }
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('physicsTest'), tasks.named('gameTestClasses'), tasks.named('verifyReleaseJar')
}

tasks.register('fluidBenchmark', JavaExec) {
    dependsOn tasks.named('physicsTestClasses')
    classpath = sourceSets.physicsTest.runtimeClasspath
    mainClass = 'com.diliupengyun.differential_create.FluidBenchmark'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
