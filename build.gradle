plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Create, Ponder, Flywheel
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // JEI
    maven {
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    // Development profiling mods.
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            def regressionId = providers.gradleProperty('regressionRunId')
            if (regressionId.isPresent() && !(regressionId.get() ==~ /[a-zA-Z0-9_-]{1,64}/))
                throw new GradleException('regressionRunId must be a simple owned run name')
            gameDirectory = regressionId.isPresent() ? project.file('build/regression/' + regressionId.get()) : project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Opt-in, disposable-world measurements of the complete fluid/shaft tick.
        fluidBenchmarkServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/fluid-network-performance/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_perf'
            systemProperty 'differentialcreate.perf.case', providers.gradleProperty('fluidPerfCase').getOrElse('all')
        }

        // Opt-in behavioural partitions in an owned disposable world. A named
        // run can be reused for the explicit prepare/resume restart pair.
        fluidCoverageServer {
            type = "gameTestServer"
            def coverageRunId = providers.gradleProperty('fluidCoverageRunId').getOrElse(UUID.randomUUID().toString())
            if (!(coverageRunId ==~ /[a-zA-Z0-9_-]{1,64}/))
                throw new GradleException('fluidCoverageRunId must be a simple owned run name')
            gameDirectory = project.file('build/fluid-coverage/runs/' + coverageRunId)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_coverage'
            systemProperty 'differentialcreate.coverage.select', providers.gradleProperty('fluidCoverageSelect').getOrElse('.*')
            systemProperty 'differentialcreate.coverage.restart', providers.gradleProperty('fluidCoverageRestart').getOrElse('')
        }

        virtualAirServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/virtual-air/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_air'
            systemProperty 'differentialcreate.air.select', providers.gradleProperty('virtualAirSelect').getOrElse('.*')
            systemProperty 'differentialcreate.air.legacy', providers.gradleProperty('virtualAirLegacy').getOrElse('false')
            systemProperty 'differentialcreate.coverage.audit', 'true'
            systemProperty 'differentialcreate.structureAudit', providers.gradleProperty('virtualAirAudit').getOrElse('false')
            logLevel = org.slf4j.event.Level.INFO
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

neoForge.runs.fluidBenchmarkServer { logLevel = org.slf4j.event.Level.INFO }

tasks.named('runFluidBenchmarkServer') {
    notCompatibleWithConfigurationCache('Each performance invocation requires a new empty world.')
}

tasks.named('runVirtualAirServer') {
    notCompatibleWithConfigurationCache('Each native virtual-air run requires a fresh disposable world.')
    doLast {
        def directory = neoForge.runs.getByName('virtualAirServer').gameDirectory.get().asFile
        def log = new File(directory, 'logs/latest.log')
        if (!log.isFile() || !(log.text =~ /All \d+ required tests passed/))
            throw new GradleException('Virtual-air server did not report a completed successful test run; inspect its latest.log.')
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create: compile against it, ship nothing (it's a required mod dependency at runtime)
    compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}"
    // Exclude Create's transitive optional compat mods; enable selected ones explicitly below.
    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: "mezz.jei"
        exclude group: "maven.modrinth"
        exclude group: "dev.ftb.mods"
        exclude group: "info.journeymap"
        exclude group: "top.theillusivec4.curios"
        exclude group: "cc.tweaked"
        exclude group: "dev.architectury"
    }

    // JEI for viewing recipes during development.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Spark for measuring actual TPS and profiling development runs.
    localRuntime "maven.modrinth:spark:${spark_version}"

    // Create's compile-time dependencies (types referenced from Create's classes)
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

sourceSets {
    physicsTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('physicsTest', JavaExec) {
    dependsOn tasks.named('physicsTestClasses')
    classpath = sourceSets.physicsTest.runtimeClasspath
    mainClass = 'com.diliupengyun.differential_create.PhysicsRegression'
}
tasks.named('check') { dependsOn tasks.named('physicsTest') }

tasks.register('fluidBenchmark', JavaExec) {
    dependsOn tasks.named('physicsTestClasses')
    classpath = sourceSets.physicsTest.runtimeClasspath
    mainClass = 'com.diliupengyun.differential_create.FluidBenchmark'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
