plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Create, Ponder, Flywheel
    maven { url = "https://maven.createmod.net" }
    // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    // JEI
    maven {
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    // Development profiling mods.
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Game integration tests and client audits are available in development runs only.
// The published Java component still contains only sourceSets.main.output.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        trainClientSmoke {
            client()
            gameDirectory = project.file('build/train-client/runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.trainClientSmoke', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }

        loadGaugeServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/load-gauge/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_gauge'
            logLevel = org.slf4j.event.Level.INFO
        }

        gravityServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gravity/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_gravity'
            systemProperty 'differentialcreate.gravity.select', providers.gradleProperty('gravitySelect').getOrElse('.*')
            systemProperty 'differentialcreate.gravity.report', project.file('build/gravity-measurement/samples').absolutePath
            logLevel = org.slf4j.event.Level.INFO
        }

        selectedRegressionServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/regression/selected/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_regression'
            systemProperty 'differentialcreate.regression.select', providers.gradleProperty('regressionSelect').getOrElse('(?!)')
            systemProperty 'differentialcreate.regression.repeat', providers.gradleProperty('regressionRepeat').getOrElse('1')
            logLevel = org.slf4j.event.Level.INFO
        }

        backtankServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/backtank/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_backtank'
        }

        ejectorServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/ejector/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_ejector'
        }

        crusherServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/crusher/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_crusher'
        }

        logisticsServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/logistics/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_logistics'
            systemProperty 'differentialcreate.logistics.knownIssues', providers.gradleProperty('logisticsKnownIssues').getOrElse('false')
        }

        logisticsClientSmoke {
            client()
            gameDirectory = project.file('build/logistics/client-runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.logisticsClientSmoke', 'true'
        }

        beltClientSmoke {
            client()
            gameDirectory = project.file('build/belt/client-runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.beltClientSmoke', 'true'
            programArguments.addAll '--width', '1100', '--height', '760'
            logLevel = org.slf4j.event.Level.INFO
        }

        ejectorClientSmoke {
            client()
            gameDirectory = project.file('build/ejector/client-runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.ejectorClientSmoke', 'true'
        }

        loadGaugeClientSmoke {
            client()
            gameDirectory = project.file('build/load-gauge/client-runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.loadGaugeClientSmoke', 'true'
            systemProperty 'differentialcreate.gaugePreviewPath', project.file('build/load-gauge/preview.png').absolutePath
            programArguments.addAll '--width', '1100', '--height', '760'
            logLevel = org.slf4j.event.Level.INFO
        }

        ponderClientSmoke {
            client()
            gameDirectory = project.file('build/ponder/runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.ponderClientSmoke', 'true'
            systemProperty 'differentialcreate.ponderAudit', providers.gradleProperty('ponderAudit').orElse('false').get()
            systemProperty 'differentialcreate.ponderCapture', providers.gradleProperty('ponderCapture').orElse('true').get()
            systemProperty 'differentialcreate.ponderCaptureScenes', providers.gradleProperty('ponderCaptureScenes').orElse('').get()
            systemProperty 'differentialcreate.ponderFrameAudit', providers.gradleProperty('ponderFrameAudit').orElse('').get()
            systemProperty 'differentialcreate.ponderVideo', providers.gradleProperty('ponderVideo').orElse('false').get()
            systemProperty 'differentialcreate.ponderVideoScenes', providers.gradleProperty('ponderVideoScenes').orElse('').get()
            systemProperty 'differentialcreate.ponderVideoComponent', providers.gradleProperty('ponderVideoComponent').orElse('').get()
            systemProperty 'differentialcreate.ponderVideoEncoder', providers.gradleProperty('ponderVideoEncoder').orElse('').get()
            systemProperty 'differentialcreate.ponderVideoPath', project.file(providers.gradleProperty('ponderVideoPath').orElse('build/ponder-video/recordings').get()).absolutePath
            systemProperty 'differentialcreate.ponderVideoGuiScale', providers.gradleProperty('ponderVideoGuiScale').orElse('2').get()
            systemProperty 'differentialcreate.ponderVideoFps', providers.gradleProperty('ponderVideoFps').orElse('60').get()
            systemProperty 'differentialcreate.ponderPreviewPath', project.file('build/ponder/previews').absolutePath
            programArguments.addAll '--width', providers.gradleProperty('ponderWidth').orElse('1200').get(),
                '--height', providers.gradleProperty('ponderHeight').orElse('900').get()
        }

        structureClientAudit {
            client()
            gameDirectory = project.file('build/full-audit/client-runs/' + UUID.randomUUID())
            systemProperty 'differentialcreate.structureClientAudit', 'true'
            systemProperty 'differentialcreate.structureClientSelect', providers.gradleProperty('structureClientSelect').getOrElse('.*')
            systemProperty 'differentialcreate.structureClientHold', providers.gradleProperty('structureClientHold').getOrElse('false')
            systemProperty 'differentialcreate.structureClientGridStart', providers.gradleProperty('structureClientGridStart').getOrElse('0')
            systemProperty 'differentialcreate.structureClientReport', project.file(providers.gradleProperty('structureClientReport').getOrElse('build/full-audit/world')).absolutePath
            programArguments.addAll '--width', '1280', '--height', '900'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            def regressionId = providers.gradleProperty('regressionRunId')
            if (regressionId.isPresent() && !(regressionId.get() ==~ /[a-zA-Z0-9_-]{1,64}/))
                throw new GradleException('regressionRunId must be a simple owned run name')
            gameDirectory = regressionId.isPresent() ? project.file('build/regression/' + regressionId.get()) : project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Opt-in, disposable-world measurements of the complete fluid/shaft tick.
        fluidBenchmarkServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/fluid-network-performance/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_perf'
            systemProperty 'differentialcreate.perf.case', providers.gradleProperty('fluidPerfCase').getOrElse('all')
        }

        // Opt-in behavioural partitions in an owned disposable world. A named
        // run can be reused for the explicit prepare/resume restart pair.
        fluidCoverageServer {
            type = "gameTestServer"
            def coverageRunId = providers.gradleProperty('fluidCoverageRunId').getOrElse(UUID.randomUUID().toString())
            if (!(coverageRunId ==~ /[a-zA-Z0-9_-]{1,64}/))
                throw new GradleException('fluidCoverageRunId must be a simple owned run name')
            gameDirectory = project.file('build/fluid-coverage/runs/' + coverageRunId)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_coverage'
            systemProperty 'differentialcreate.coverage.select', providers.gradleProperty('fluidCoverageSelect').getOrElse('.*')
            systemProperty 'differentialcreate.coverage.restart', providers.gradleProperty('fluidCoverageRestart').getOrElse('')
        }

        virtualAirServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/virtual-air/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_air'
            systemProperty 'differentialcreate.air.select', providers.gradleProperty('virtualAirSelect').getOrElse('.*')
            systemProperty 'differentialcreate.air.referenceTests', providers.gradleProperty('virtualAirReferenceTests').getOrElse('false')
            systemProperty 'differentialcreate.coverage.audit', 'true'
            systemProperty 'differentialcreate.structureAudit', providers.gradleProperty('virtualAirAudit').getOrElse('false')
            logLevel = org.slf4j.event.Level.INFO
        }

        motionCoverageServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/motion-coverage/runs/' + UUID.randomUUID())
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_motion'
            systemProperty 'differentialcreate.motion.select', providers.gradleProperty('motionSelect').getOrElse('.*')
            logLevel = org.slf4j.event.Level.INFO
        }

        trainCoverageServer {
            type = "gameTestServer"
            def trainRunId = providers.gradleProperty('trainRunId').getOrElse(UUID.randomUUID().toString())
            if (!(trainRunId ==~ /[a-zA-Z0-9_-]{1,64}/))
                throw new GradleException('trainRunId must be a simple owned run name')
            gameDirectory = project.file('build/train-coverage/runs/' + trainRunId)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'differentialcreate_trains'
            systemProperty 'differentialcreate.trains.select', providers.gradleProperty('trainSelect').getOrElse('.*')
            systemProperty 'differentialcreate.trains.restart', providers.gradleProperty('trainRestart').getOrElse('')
            logLevel = org.slf4j.event.Level.INFO
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

